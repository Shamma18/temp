name: Build on PR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest 
    
    steps:
        - name: Checkout Code
          uses: actions/checkout@v3  
          
        - name: ssh into machine
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.HOST }}
            username: ${{ secrets.USERNAME }}
            key: ${{ secrets.KEY }}
            script: |
                cd /home/ubuntu/temp
                git pull origin main
                npm install
                pm2 restart all